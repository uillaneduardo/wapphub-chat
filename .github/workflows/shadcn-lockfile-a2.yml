# Temporary, branch-scoped lockfile generation on GitHub-hosted npm registry.
# Removed from PR before merge. No production deployment or secrets.
name: Generate shadcn lockfile A2
on:
  push:
    branches: [feat/shadcn-official-a2-20261022]
permissions:
  contents: write
jobs:
  generate-lock:
    if: github.repository == 'uillaneduardo/wapphub-chat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and sanity check real npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); for(const n of ['tailwindcss','@tailwindcss/vite','class-variance-authority','clsx','tailwind-merge','@radix-ui/react-slot']) { if(!p.packages['node_modules/'+n]) throw Error('missing '+n) }"
      - name: Commit only generated lockfile to this feature branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(shadcn): generate verified npm lockfile on CI runner"
            git push origin "HEAD:refs/heads/feat/shadcn-official-a2-20261022"
          fi
